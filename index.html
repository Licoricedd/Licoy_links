<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Licoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eddde3;
    --ink:#830b31;
    --ink-soft:#8a5568;
    --line:rgba(79,10,32,0.16);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    color:var(--ink);
  }

  body{
    font-family:'Space Grotesk', sans-serif;
    display:flex;
    justify-content:center;
    padding:88px 24px 64px;
  }

  .page{
    width:100%;
    max-width:400px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .mark{
    font-size:20px;
    letter-spacing:0.04em;
    margin-bottom:22px;
    color:var(--ink);
  }

  h1{
    font-family:'Newsreader', serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(30px, 8vw, 38px);
    margin:0 0 10px;
    line-height:1.15;
  }

  .tagline{
    font-size:14.5px;
    color:var(--ink-soft);
    margin:0 0 48px;
    line-height:1.6;
    max-width:280px;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
  }

  .card{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:18px 4px;
    border-top:1px solid var(--line);
    text-decoration:none;
    color:var(--ink);
    transition:opacity 0.15s ease;
  }
  .links .card:last-child{ border-bottom:1px solid var(--line); }

  .card:hover, .card:focus-visible{
    opacity:0.6;
    outline:none;
  }
  .card:focus-visible{
    box-shadow:inset 0 0 0 1px var(--ink);
  }

  .icon{
    flex:0 0 auto;
    width:20px;
    height:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
  }
  .icon svg{ width:18px; height:18px; }

  .label{
    flex:1 1 auto;
    text-align:left;
  }
  .label .name{
    display:block;
    font-size:16px;
    font-weight:500;
    margin-bottom:2px;
  }
  .label .desc{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
  }

  .go{
    flex:0 0 auto;
    font-family:'Newsreader', serif;
    font-style:italic;
    font-size:18px;
    color:var(--ink-soft);
  }

  footer{
    margin-top:48px;
    font-size:12px;
    color:var(--ink-soft);
  }

  @media (max-width:360px){
    body{ padding:64px 18px 48px; }
  }
</style>
</head>
